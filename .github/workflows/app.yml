name: app

on:
  push:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
  workflow_dispatch:

jobs:

  # Pruebas unitarias y cobertura
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar desde el lock file
        run: npm ci

      - name: Pruebas con reporte de cobertura
        run: npm run test:coverage

      - name: Subir el reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          if-no-files-found: error

  # A2 - Calidad con SonarCloud
  calidad:
    needs: pruebas
    if: always() && needs.pruebas.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura
          path: coverage/

      - name: Analizar calidad con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  # A2 - Deteccion de secretos
  secretos:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio e historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A2 - Analisis de dependencias
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Analizar dependencias con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: package-lock.json
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: '0'
          skip-dirs: node_modules

  # A2 - Analisis estatico con Semgrep
  estatico:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Analizar codigo fuente
        run: |
          docker run --rm \
            --volume "${PWD}:/src" \
            --workdir /src \
            --env SEMGREP_SEND_METRICS=off \
            semgrep/semgrep \
            semgrep scan \
            --config=p/default \
            --config=p/javascript \
            --json --quiet \
            --output=semgrep.json \
            src/

      - name: Mostrar resultados
        if: always()
        run: |
          if [ -f semgrep.json ]; then
            cat semgrep.json
          fi

  # A3 - Construcción y publicación de la imagen en ECR
  publicar:
    needs:
      - calidad
      - secretos
      - dependencias
      - estatico
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.secretos.result == 'success' &&
      needs.calidad.result == 'success' &&
      needs.dependencias.result == 'success' &&
      needs.estatico.result == 'success'
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.publicacion.outputs.digest }}

    env:
      APLICACION: inf384-lab3
      VERSION: v1.0.0
      AMBIENTE: dev
      REGION: us-east-1

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales temporales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Identificar cuenta y registro ECR
        id: registro
        shell: bash
        run: |
          set -euo pipefail
          cuenta="$(aws sts get-caller-identity --query Account --output text)"
          registro="${cuenta}.dkr.ecr.${REGION}.amazonaws.com"
          echo "registro=${registro}" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y publicar imagen con SHA corto
        id: publicacion
        shell: bash
        env:
          REGISTRO: ${{ steps.registro.outputs.registro }}
        run: |
          set -euo pipefail

          repositorio="${REGISTRO}/${APLICACION}"
          sha_corto="${GITHUB_SHA:0:7}"

          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.title=${APLICACION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${repositorio}:${sha_corto}" \
            .

          docker push "${repositorio}:${sha_corto}"

          digest="$(aws ecr describe-images \
            --repository-name "${APLICACION}" \
            --image-ids "imageTag=${sha_corto}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          if [[ ! "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::No se obtuvo un digest válido de ECR."
            exit 1
          fi

          echo "digest=${repositorio}@${digest}" >> "$GITHUB_OUTPUT"

          # Agregar los tags de versión y ambiente al mismo manifiesto.
          # No se vuelven a enviar las capas de la imagen.
          manifiesto="$(aws ecr batch-get-image \
            --repository-name "${APLICACION}" \
            --image-ids "imageDigest=${digest}" \
            --query 'images[0].imageManifest' \
            --output text)"

          if [[ -z "${manifiesto}" || "${manifiesto}" == "None" ]]; then
            echo "::error::No se pudo obtener el manifiesto publicado."
            exit 1
          fi

          for etiqueta in "${VERSION}" "${AMBIENTE}"; do
            aws ecr put-image \
              --repository-name "${APLICACION}" \
              --image-tag "${etiqueta}" \
              --image-manifest "${manifiesto}"
          done

          {
            echo "### Imagen publicada"
            echo
            echo "- Repositorio: \`${repositorio}\`"
            echo "- SHA corto: \`${sha_corto}\`"
            echo "- Versión: \`${VERSION}\`"
            echo "- Ambiente: \`${AMBIENTE}\`"
            echo "- Digest: \`${repositorio}@${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
