name: app

on:
  push:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
  workflow_dispatch:

jobs:

  # Pruebas unitarias y cobertura
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar desde el lock file
        run: npm ci

      - name: Pruebas con reporte de cobertura
        run: npm run test:coverage

      - name: Subir el reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          if-no-files-found: error

  # A2 - Calidad con SonarCloud
  calidad:
    needs: pruebas
    if: always() && needs.pruebas.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura
          path: coverage/

      - name: Analizar calidad con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  # A2 - Deteccion de secretos
  secretos:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio e historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A2 - Analisis de dependencias
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Analizar dependencias con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: package-lock.json
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: '0'
          skip-dirs: node_modules

  # A2 - Analisis estatico con Semgrep
  estatico:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Analizar codigo fuente
        run: |
          docker run --rm \
            --volume "${PWD}:/src" \
            --workdir /src \
            --env SEMGREP_SEND_METRICS=off \
            semgrep/semgrep \
            semgrep scan \
            --config=p/default \
            --config=p/javascript \
            --json --quiet \
            --output=semgrep.json \
            src/

      - name: Mostrar resultados
        if: always()
        run: |
          if [ -f semgrep.json ]; then
            cat semgrep.json
          fi

  # A3 - Pendiente de implementar
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Sin implementar
        run: |
          echo "::error::El job 'publicar' no esta implementado."
          exit 1

  # Job de despliegue original: no modificar
  desplegar:
    needs: publicar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Actualizar la funcion por digest
        run: |
          aws lambda update-function-code \
            --function-name inf384-lab3 \
            --image-uri ${{ needs.publicar.outputs.digest }}

      - name: Esperar a que la actualizacion termine
        run: aws lambda wait function-updated --function-name inf384-lab3
