name: infra

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:

  # B1: formato, inicializacion y validacion
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'

      - name: Configurar credenciales temporales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Comprobar formato
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Inicializar backend remoto
        working-directory: infra
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Validar configuracion
        working-directory: infra
        run: terraform validate -no-color

  # B2: politicas de infraestructura
  politicas:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Analizar infraestructura con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'

  # B3: generar, publicar y controlar el plan
  plan:
    needs: [validar, politicas]
    runs-on: ubuntu-latest

    outputs:
      tiene_destrucciones: ${{ steps.comprobar.outputs.tiene_destrucciones }}

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false

      - name: Configurar credenciales temporales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Inicializar backend remoto
        working-directory: infra
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Generar plan guardado
        working-directory: infra
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Exportar plan a JSON y texto
        working-directory: infra
        run: |
          terraform show -json tfplan > tfplan.json
          terraform show -no-color tfplan > tfplan.txt

      - name: Publicar plan en el pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### Plan de Terraform'
            echo
            echo '```text'
            cat infra/tfplan.txt
            echo '```'
          } > comentario.md

          gh pr comment "$PR" --body-file comentario.md

      - name: Mostrar plan en el resumen
        run: |
          {
            echo '### Plan de Terraform'
            echo
            echo '```text'
            cat infra/tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comprobar acciones de destruccion
        id: comprobar
        working-directory: infra
        run: |
          set -euo pipefail

          destrucciones="$(jq -r '
            .resource_changes[]?
            | select(.change.actions | index("delete"))
            | .address
          ' tfplan.json)"

          if [ -n "$destrucciones" ]; then
            echo "tiene_destrucciones=true" >> "$GITHUB_OUTPUT"
            echo "::error::El plan contiene acciones de destruccion:"
            echo "$destrucciones"
            echo "Se requiere autorizacion humana explicita antes de aplicar este plan."
            exit 1
          fi

          echo "tiene_destrucciones=false" >> "$GITHUB_OUTPUT"
          echo "El plan no contiene acciones de destruccion."

      - name: Guardar plan para el job aplicar
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: plan-terraform
          path: infra/tfplan
          if-no-files-found: error
          retention-days: 1

  # B4: aplicar exactamente el plan guardado
  aplicar:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false

      - name: Configurar credenciales temporales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Descargar plan guardado
        uses: actions/download-artifact@v4
        with:
          name: plan-terraform
          path: infra/

      - name: Inicializar backend remoto
        working-directory: infra
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Aplicar el plan guardado
        working-directory: infra
        run: terraform apply -input=false -no-color tfplan
